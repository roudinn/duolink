limit_req_zone $binary_remote_addr zone=duolink_requests:1m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=duolink_signals:1m;
limit_conn_zone $binary_remote_addr zone=duolink_downloads:1m;

server {
    listen 80;
    listen [::]:80;
    server_name duolink.154.86.119.7.sslip.io;
    access_log off;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://duolink.154.86.119.7.sslip.io$request_uri; }
}

# Port 443 is dispatched by the VPS's existing TLS SNI router.
server {
    listen 127.0.0.1:9464 ssl;
    server_name duolink.154.86.119.7.sslip.io;
    ssl_certificate /etc/letsencrypt/live/duolink.154.86.119.7.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/duolink.154.86.119.7.sslip.io/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log off;
    # Topic URLs act as mailbox addresses. Keep them out of request logs.
    error_log /var/log/nginx/duolink-error.log crit;
    limit_req_status 429;
    limit_conn_status 429;
    add_header X-Content-Type-Options nosniff always;

    location /signal/ {
        # The TLS router forwards every request from loopback. Use a global
        # limit here and cap live subscriptions in the application.
        limit_req zone=duolink_requests burst=256 nodelay;
        limit_conn duolink_signals 192;
        client_max_body_size 2k;
        client_body_timeout 10s;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 35s;
        proxy_pass http://127.0.0.1:8705;
    }

    location = /healthz {
        proxy_pass http://127.0.0.1:8705;
    }

    location /downloads/ {
        root /srv/duolink;
        autoindex off;
        limit_conn duolink_downloads 16;
        limit_rate 4m;
    }

    location / { return 404; }
}
