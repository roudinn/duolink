[package]
name = "duolink"
version = "1.12.5"
edition = "2024"
rust-version = "1.88"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.22"
rand = "0.8"
rcgen = "0.14"
rsa = "0.9"
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
subtle = "2.6"
tempfile = "3"
uuid = { version = "1", features = ["v4", "serde"] }
local-ip-address = "0.6"
opusic-c = "1.6.1"
tao = { version = "0.37", default-features = false, features = ["rwh_06"] }
wry = { version = "0.57", default-features = false }
clipboard-win = { version = "5.4", features = ["std"] }
windows-sys = { version = "0.61", features = ["Win32_Devices_DeviceAndDriverInstallation", "Win32_Foundation", "Win32_Graphics_Gdi", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_NetworkManagement_WiFi", "Win32_Networking_WinSock", "Win32_Security", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Power", "Win32_System_Registry", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Threading", "Win32_System_Variant"] }
windows-core = "0.62"
webview2-com = "0.39"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
igd-next = "0.16"
ring = "0.17"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls", "ring"] }
bytes = "1"
socket2 = "0.6"
x25519-dalek = { version = "2", features = ["static_secrets"] }
tray-icon = { version = "0.21", default-features = false }

[build-dependencies]
embed-resource = "3"

[profile.release]
lto = "fat"
codegen-units = 1
strip = "symbols"
