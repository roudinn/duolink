name: DuoLink server

on:
  workflow_dispatch:
    inputs:
      ipv4:
        description: Public IPv4 of a self-hosted server
        type: string
        required: true
      origin:
        description: HTTPS origin of a self-hosted server
        type: string
        required: true
  push:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"
  pull_request:
    paths:
      - "server/**"
      - ".github/workflows/server.yml"

permissions:
  contents: read

jobs:
  capacity:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Build and test server
        run: |
          cargo test --release --locked --manifest-path server/Cargo.toml
          cargo build --release --locked --manifest-path server/Cargo.toml
      - name: Check relay admission and slot reuse
        run: node --experimental-websocket server/tests/relay.mjs server/target/release/duolink-server
      - name: Exercise 100 simultaneous users through nginx
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nginx libnginx-mod-stream
          bash server/tests/nginx-capacity.sh server/target/release/duolink-server
      - name: Prepare checked Linux build
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          mkdir -p deploy-artifact
          install -m 0755 server/target/release/duolink-server deploy-artifact/duolink-server
          install -m 0644 server/deploy/nginx.conf deploy-artifact/duolink.conf
          cd deploy-artifact
          sha256sum duolink-server duolink.conf > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          name: duolink-server-linux-x86_64
          path: deploy-artifact/
          if-no-files-found: error
  public-health:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check public HTTPS and both STUN ports
        env:
          DUOLINK_HEALTH_IPV4: ${{ inputs.ipv4 }}
          DUOLINK_HEALTH_ORIGIN: ${{ inputs.origin }}
        run: node server/tests/public-status.mjs
